name: Tests and real-data reproduction
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: shelfcast reproduce
      - run: jupyter nbconvert --to notebook --execute notebooks/walkthrough.ipynb --output /tmp/shelfcast-walkthrough.ipynb
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-evidence
          path: |
            outputs/RESULTS.md
            outputs/*metrics.csv
            outputs/*metrics.json
            outputs/*.png
